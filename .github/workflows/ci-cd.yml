name: ci-cd

# CI: every pull request and every push to develop or release/**.
# CD: push to develop -> dev. Push that creates or updates release/** -> itg.
# Branch flow: docs/BRANCHING_AND_RELEASE.md in the project folder.

on:
  pull_request:
    branches: [develop, "release/**"]
  push:
    branches: [develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-functions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: function_app
  PYTHON_VERSION: "3.11"

jobs:
  ci:
    name: CI (lint and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            function_app/requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (errors and undefined names)
        run: ruff check --select E9,F --exclude .ipynb_checkpoints function_app tests
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q --exclude '\.ipynb_checkpoints' function_app

  deploy-dev:
    name: CD (dev)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App to dev
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.APP_DIR }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

  deploy-itg:
    name: CD (itg)
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: itg
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App to itg
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.APP_DIR }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
